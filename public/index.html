/* ---------- 1. 消息反馈 👍/👎 ---------- */
var FeedbackState = { items: [], byMessageId: {} };

async function loadFeedback(sessionId) {
  if (!sessionId) { FeedbackState.items = []; FeedbackState.byMessageId = {}; return; }
  try {
    var r = await Api.get('/api/feedback?sessionId=' + encodeURIComponent(sessionId));
    FeedbackState.items = r.items || [];
    FeedbackState.byMessageId = {};
    for (var i = 0; i < FeedbackState.items.length; i++) {
      var it = FeedbackState.items[i];
      if (it && it.messageId) FeedbackState.byMessageId[it.messageId] = it;
    }
  } catch (e) {
    FeedbackState.items = []; FeedbackState.byMessageId = {};
  }
}

async function sendFeedback(messageId, rating) {
  if (!State.activeSession || !messageId) return;
  var cur = FeedbackState.byMessageId[messageId];
  var curRating = cur ? cur.rating : null;
  // 再次点击同一档 = 取消（rating: none），与 PC 端 toggle 语义一致
  var next = curRating === rating ? 'none' : rating;
  try {
    await Api.post('/api/feedback', { sessionId: State.activeSession, messageId: messageId, rating: next });
    await loadFeedback(State.activeSession);
    renderTimeline();          // 重渲染以更新按钮状态
    toast(next === 'none' ? '已取消反馈' : (next === 'positive' ? '已点赞' : '已点踩'));
  } catch (e) {
    toast('反馈失败：' + e.message);
  }
}



/* ---------- 2. 斜杠命令 ---------- */
var CmdState = { list: [], unavailable: false, open: false, index: 0 };

async function loadCommands(sessionId) {
  if (!sessionId) { CmdState.list = []; CmdState.unavailable = false; return; }
  try {
    var r = await Api.get('/api/commands?sessionId=' + encodeURIComponent(sessionId));
    CmdState.list = r.commands || [];
    CmdState.unavailable = r.unavailable === true;
  } catch (e) {
    CmdState.list = [];
    CmdState.unavailable = false;
  }
}

/** 输入框以 "/" 开头时弹出命令菜单。 */
function updateCmdMenu() {
  var input = $('#input');
  var menu = $('#cmdMenu');
  if (!menu) return;
  var v = input.value;
  if (!v.startsWith('/')) { hideCmdMenu(); return; }
  var q = v.slice(1).toLowerCase();
  var hits = CmdState.list.filter(function (c) {
    return (c.name || '').toLowerCase().indexOf(q) >= 0 || (c.description || '').toLowerCase().indexOf(q) >= 0;
  });
  if (!hits.length) { hideCmdMenu(); return; }
  CmdState.open = true;
  if (CmdState.index >= hits.length) CmdState.index = 0;
  menu.innerHTML = '';
  hits.forEach(function (c, i) {
    var item = el('div', 'citem' + (i === CmdState.index ? ' on' : ''));
    var top = el('div', 'cname', '/' + c.name);
    item.appendChild(top);
    if (c.description) item.appendChild(el('div', 'cdesc', c.description));
    if (c.input && c.input.hint) item.appendChild(el('div', 'chint', c.input.hint));
    item.onclick = function () { applyCommand(c); };
    menu.appendChild(item);
  });
  menu.classList.remove('hidden');
}

function hideCmdMenu() {
  CmdState.open = false;
  var menu = $('#cmdMenu');
  if (menu) { menu.classList.add('hidden'); menu.innerHTML = ''; }
}

function applyCommand(c) {
  var input = $('#input');
  input.value = '/' + c.name + ' ';
  hideCmdMenu();
  input.focus();
  input.dispatchEvent(new Event('input'));
}

async function executeCommand(line) {
  if (!State.activeSession) { toast('请先选择会话'); return; }
  try {
    var r = await Api.post('/api/commands', { sessionId: State.activeSession, line: line });
    var res = (r.result && r.result.result) || {};
    toast(res.kind === 'success' ? ('命令已执行：' + (res.text || '').slice(0, 60)) : ('命令结果：' + (res.kind || '?')));
  } catch (e) {
    // 504 表示结果未知（超时），不能断言失败
    if (/504|commands-execute-failed/.test(e.message)) toast('命令超时，结果未知，请检查对话');
    else toast('命令失败：' + e.message);
  }
}

/* ---------- 3. 模型提供商配置页 ---------- */
var ProvState = { list: [], tab: 'live' };

async function openProvidersSheet() {
  ensureSheet();
  var box = $('#sheetBody'); box.innerHTML = '';
  box.appendChild(el('h3', null, '模型提供商'));
  var hint = el('div', 'field');
  hint.style.fontSize = '12px'; hint.style.color = 'var(--muted)';
  hint.textContent = '与 PC 端「设置 → 模型」同一配置通道。密钥只写不读。';
  box.appendChild(hint);

  var tabs = el('div', 'tooltabs');
  [['live', '已启用'], ['dormant', '未启用']].forEach(function (pair) {
    var b = el('button', ProvState.tab === pair[0] ? 'on' : '', pair[1]);
    b.onclick = function () { ProvState.tab = pair[0]; renderProviders(); };
    tabs.appendChild(b);
  });
  box.appendChild(tabs);

  var body = el('div'); body.id = 'provBody';
  box.appendChild(body);

  var row = el('div', 'btnrow');
  var bRefresh = el('button', 'btn', '刷新');
  bRefresh.onclick = loadProviders;
  row.appendChild(bRefresh);
  var bClose = el('button', 'btn', '关闭');
  bClose.onclick = closeSheet;
  row.appendChild(bClose);
  box.appendChild(row);
  showSheet();
  await loadProviders();
}

async function loadProviders() {
  var body = $('#provBody');
  if (body) { body.innerHTML = ''; body.appendChild(el('div', 'tempty', '加载中…')); }
  try {
    var r = await Api.get('/api/llm-providers');
    ProvState.list = r.providers || [];
  } catch (e) {
    ProvState.list = [];
    if (body) { body.innerHTML = ''; body.appendChild(el('div', 'tempty', '加载失败：' + e.message)); }
    return;
  }
  renderProviders();
}

function renderProviders() {
  var body = $('#provBody');
  if (!body) return;
  body.innerHTML = '';
  var want = ProvState.tab === 'live' ? false : true;
  var list = ProvState.list.filter(function (p) { return (p.dormant === true) === want; });
  if (!list.length) { body.appendChild(el('div', 'tempty', ProvState.tab === 'live' ? '暂无已启用提供商' : '暂无未启用提供商')); return; }
  list.forEach(function (p) {
    var item = el('div', 'titem');
    item.style.cursor = 'pointer';
    var main = el('div', 'tmain');
    main.appendChild(el('div', 'tname', p.name || p.id));
    var bits = [];
    if (p.baseURL) bits.push(p.baseURL);
    if (p.keyConfigured) bits.push('密钥已配置');
    else bits.push('未配置密钥');
    if (p.catalogModels && p.catalogModels.length) bits.push((p.catalogModels.length) + ' 个模型');
    main.appendChild(el('div', 'tsub', bits.join(' · ')));
    item.appendChild(main);
    item.appendChild(el('span', 'tstate ' + (p.keyConfigured ? 'completed' : ''), p.keyConfigured ? '就绪' : '待配置'));
    item.onclick = function () { openProviderForm(p); };
    body.appendChild(item);
  });
}

function openProviderForm(p) {
  ensureSheet();
  var box = $('#sheetBody'); box.innerHTML = '';
  box.appendChild(el('h3', null, '配置 ' + (p.name || p.id)));

  var f1 = el('div', 'field');
  f1.appendChild(el('label', null, 'Base URL'));
  var iBase = el('input'); iBase.value = p.baseURL || ''; iBase.placeholder = 'https://api.example.com';
  f1.appendChild(iBase); box.appendChild(f1);

  var f2 = el('div', 'field');
  f2.appendChild(el('label', null, 'API Key' + (p.keyConfigured ? '（已配置，留空不修改）' : '')));
  var iKey = el('input'); iKey.type = 'password'; iKey.placeholder = p.keyConfigured ? '••••••（留空保持）' : 'sk-…';
  f2.appendChild(iKey); box.appendChild(f2);

  var f3 = el('div', 'field');
  f3.appendChild(el('label', null, '命名空间（只读）'));
  var iNs = el('input'); iNs.value = p.settingsNs || ''; iNs.disabled = true;
  f3.appendChild(iNs); box.appendChild(f3);

  var status = el('div'); status.style.cssText = 'font-size:12px;color:var(--muted);margin-top:6px';
  box.appendChild(status);

  var row = el('div', 'btnrow');
  var bProbe = el('button', 'btn', '探测模型');
  bProbe.onclick = async function () {
    status.textContent = '探测中…';
    try {
      var r = await Api.post('/api/llm-providers/probe', {
        settingsNs: p.settingsNs, baseURL: iBase.value.trim(),
        apiKey: iKey.value.trim() || undefined,
      });
      var n = (r.models || []).length;
      status.textContent = '探测成功：' + n + ' 个模型' + (r.fallback ? '（回退 OpenAI 兼容）' : '');
      status.style.color = 'var(--ok)';
    } catch (e) {
      status.textContent = '探测失败：' + e.message;
      status.style.color = 'var(--err)';
    }
  };
  row.appendChild(bProbe);
  box.appendChild(row);

  var row2 = el('div', 'btnrow');
  var bSave = el('button', 'btn primary', '保存');
  bSave.onclick = async function () {
    try {
      await Api.post('/api/llm-providers', {
        provider: p.id, settingsNs: p.settingsNs,
        baseURL: iBase.value.trim(),
        apiKey: iKey.value.trim() || undefined,
      });
      toast('已保存');
      await loadProviders();
      openProvidersSheet();
    } catch (e) { toast('保存失败：' + e.message); }
  };
  row2.appendChild(bSave);
  if (p.keyConfigured) {
    var bRemove = el('button', 'btn danger', '清除密钥');
    bRemove.onclick = async function () {
      if (!confirm('清除该提供商的已存密钥？')) return;
      try {
        await Api.post('/api/llm-providers', { provider: p.id, settingsNs: p.settingsNs, removeKey: true });
        toast('已清除');
        await loadProviders(); openProvidersSheet();
      } catch (e) { toast('清除失败：' + e.message); }
    };
    row2.appendChild(bRemove);
  }
  var bBack = el('button', 'btn', '返回');
  bBack.onclick = openProvidersSheet;
  row2.appendChild(bBack);
  box.appendChild(row2);
  showSheet();
}
</script>

<script>
/* ============================================================
 * 输入框增强：图片上传 + 模型切换
 * ============================================================ */

/* ---------- 图片 ---------- */
var ImgState = { items: [], limits: null };

function fmtBytes(n) {
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n / 1024).toFixed(0) + 'K';
  return (n / 1048576).toFixed(1) + 'M';
}

async function loadImageLimits() {
  if (ImgState.limits) return ImgState.limits;
  try {
    var r = await Api.get('/api/catalog');
    ImgState.limits = r.imageLimits || {};
  } catch (e) { ImgState.limits = {}; }
  return ImgState.limits;
}

function renderImgTray() {
  var tray = $('#imgTray');
  if (!tray) return;
  if (!ImgState.items.length) { tray.classList.add('hidden'); tray.innerHTML = ''; return; }
  tray.classList.remove('hidden');
  tray.innerHTML = '';
  ImgState.items.forEach(function (it, idx) {
    var box = el('div', 'thumb');
    var img = el('img'); img.src = it.dataUrl; img.alt = it.name || 'img';
    box.appendChild(img);
    var del = el('div', 'del', '×');
    del.onclick = function () { ImgState.items.splice(idx, 1); renderImgTray(); };
    box.appendChild(del);
    box.appendChild(el('div', 'sz', fmtBytes(it.size)));
    tray.appendChild(box);
  });
}

function readFileAsDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result || '')); };
    fr.onerror = function () { reject(new Error('read-failed')); };
    fr.readAsDataURL(file);
  });
}

async function addImageFiles(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) { toast('没有选中文件'); return; }
  console.log('[img] picked', files.map(function (f) { return { name: f.name, type: f.type, size: f.size }; }));
  toast('正在处理 ' + files.length + ' 张图片…');

  var limits = null;
  try { limits = await loadImageLimits(); } catch (e) { limits = {}; }
  var maxBytes = Number((limits && limits.maxImageBytes) || 20971520);
  var maxPer = Number((limits && limits.maxImagesPerMessage) || 20);
  var allowed = (limits && limits.mediaTypes) || ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];

  var added = 0, failed = 0, lastErr = '';
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (ImgState.items.length >= maxPer) { toast('最多 ' + maxPer + ' 张图片'); break; }

    // 类型判定：优先用 file.type；为空/非标准时按扩展名兜底（安卓相册常见空 type）
    var type = String(f.type || '').toLowerCase();
    if (!type || allowed.indexOf(type) < 0) {
      var ext = String(f.name || '').toLowerCase().split('.').pop();
      var byExt = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif' };
      if (byExt[ext]) type = byExt[ext];
      else if (type.indexOf('image/') === 0) { /* 接受未知 image/* 子类型，交给内核裁决 */ }
      else { failed++; lastErr = '不支持的格式：' + (f.type || f.name || '未知'); console.warn('[img] reject type', f.type, f.name); continue; }
    }
    if (f.size > maxBytes) { failed++; lastErr = '图片过大（上限 ' + fmtBytes(maxBytes) + '）'; console.warn('[img] too big', f.size); continue; }

    try {
      var dataUrl = await readFileAsDataUrl(f);
      var comma = dataUrl.indexOf(',');
      if (comma < 0) throw new Error('bad-dataurl');
      var base64 = dataUrl.slice(comma + 1);
      if (!base64) throw new Error('empty-base64');
      ImgState.items.push({ mediaType: type, data: base64, name: f.name || '', size: f.size, dataUrl: dataUrl });
      added++;
    } catch (e) {
      failed++;
      lastErr = '读取失败：' + (e && e.message ? e.message : '未知');
      console.warn('[img] read fail', e);
    }
  }
  renderImgTray();
  console.log('[img] done added=' + added + ' failed=' + failed + ' total=' + ImgState.items.length);

  if (added > 0) toast('已添加 ' + added + ' 张图片');
  else if (failed > 0) toast(lastErr || '图片添加失败');
  else toast('未添加任何图片');
}

/* ---------- 模型切换 ---------- */
var ModelState = { catalog: null, current: null, provider: '', model: '', reasoning: '' };

async function loadModelCatalog() {
  if (ModelState.catalog) return ModelState.catalog;
  var r = await Api.get('/api/catalog');
  ModelState.catalog = r;
  return r;
}

async function loadCurrentConfig() {
  if (!State.activeSession) return null;
  try {
    var r = await Api.get('/api/session-config?sessionId=' + encodeURIComponent(State.activeSession));
    ModelState.current = r.config || null;
    ModelState.provider = (r.config && r.config.provider) || '';
    ModelState.model = (r.config && r.config.model) || '';
    ModelState.reasoning = (r.config && r.config.reasoningEffort) || '';
    updateModelBtn();
  } catch (e) { ModelState.current = null; }
  return ModelState.current;
}

/** 模型简称：去掉 deepseek 前缀与版本噪声，保留可辨识部分。 */
function shortModelName(provider, model) {
  let m = String(model || '');
  if (!m) return '(未设置)';
  // deepseek/deepseek-v4.1-flash -> v4.1-flash
  m = m.split('/').pop() || m;
  m = m.replace(/^deepseek[-_]?/i, '');
  return m || model;
}

function updateModelBtn() {
  const label = $('#btnModel');
  const reason = $('#metaReason');
  const dot = $('#metaDot');
  if (!label) return;
  const name = shortModelName(ModelState.provider, ModelState.model);
  label.textContent = name;
  label.title = '点击切换模型（当前：' + (ModelState.provider || '?') + ' / ' + (ModelState.model || '?') + '）';
  if (reason) {
    if (ModelState.reasoning) {
      reason.textContent = ModelState.reasoning;
      if (dot) dot.classList.remove('hidden');
    } else {
      reason.textContent = '';
      if (dot) dot.classList.add('hidden');
    }
  }
}

async function openModelSheet() {
  ensureSheet();
  var box = $('#sheetBody'); box.innerHTML = '';
  box.appendChild(el('h3', null, '切换模型'));
  var body = el('div'); body.id = 'modelBody';
  box.appendChild(body);
  var row = el('div', 'btnrow');
  var bClose = el('button', 'btn', '关闭'); bClose.onclick = closeSheet;
  row.appendChild(bClose);
  box.appendChild(row);
  showSheet();
  await renderModelBody();
}

async function renderModelBody() {
  var body = $('#modelBody');
  if (!body) return;
  body.innerHTML = '';
  if (!State.activeSession) { body.appendChild(el('div', 'tempty', '请先选择一个会话')); return; }
  body.appendChild(el('div', 'tempty', '加载中…'));

  var cat;
  try { cat = await loadModelCatalog(); } catch (e) {
    body.innerHTML = ''; body.appendChild(el('div', 'tempty', '加载失败：' + (e && e.message))); return;
  }
  await loadCurrentConfig();
  body.innerHTML = '';

  var models = cat.models || [];
  var byProv = new Map();
  models.forEach(function (m) {
    var p = m.provider || 'unknown';
    if (!byProv.has(p)) byProv.set(p, []);
    byProv.get(p).push(m);
  });

  var cur = el('div', 'field');
  cur.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6';
  cur.textContent = '当前：' + (ModelState.provider || '?') + ' / ' + (ModelState.model || '?') +
    (ModelState.reasoning ? ' · 推理 ' + ModelState.reasoning : '');
  body.appendChild(cur);

  var curModel = models.find(function (m) { return m.id === ModelState.model && m.provider === ModelState.provider; })
              || models.find(function (m) { return m.id === ModelState.model; });
  var efforts = (curModel && curModel.reasoning && curModel.reasoning.efforts) || [];
  if (efforts.length) {
    var efWrap = el('div', 'field');
    efWrap.appendChild(el('label', null, '推理强度'));
    var efRow = el('div'); efRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';
    efforts.forEach(function (e) {
      var on = e.id === ModelState.reasoning;
      var b = el('button', 'btn', e.name || e.id);
      b.style.cssText = 'flex:0 0 auto;padding:6px 12px;font-size:12px' + (on ? ';border-color:var(--accent);color:var(--accent)' : '');
      b.onclick = function () { applyModel(ModelState.provider, ModelState.model, e.id); };
      efRow.appendChild(b);
    });
    efWrap.appendChild(efRow);
    body.appendChild(efWrap);
  }

  byProv.forEach(function (list, prov) {
    var ph = el('div', 'wshead');
    ph.appendChild(el('span', 'wsarrow', '▾'));
    ph.appendChild(el('span', 'wstitle', prov));
    ph.appendChild(el('span', 'wscount', String(list.length)));
    body.appendChild(ph);
    list.forEach(function (m) {
      var on = m.id === ModelState.model && m.provider === ModelState.provider;
      var item = el('div', 'titem');
      item.style.cssText = 'cursor:pointer' + (on ? ';border-color:var(--accent);background:rgba(59,130,246,.06)' : '');
      var main = el('div', 'tmain');
      main.appendChild(el('div', 'tname', m.name || m.id));
      var bits = [m.id];
      if (m.imageSupported) bits.push('支持图片');
      if (m.reasoning && m.reasoning.efforts && m.reasoning.efforts.length) bits.push(m.reasoning.efforts.length + ' 档推理');
      main.appendChild(el('div', 'tsub', bits.join(' · ')));
      item.appendChild(main);
      if (on) item.appendChild(el('span', 'tstate completed', '当前'));
      item.onclick = function () { applyModel(m.provider, m.id, ''); };
      body.appendChild(item);
    });
  });
}

async function applyModel(provider, model, reasoning) {
  if (!State.activeSession) return;
  try {
    var payload = { sessionId: State.activeSession, provider: provider, model: model };
    if (reasoning) payload.reasoningEffort = reasoning;
    var r = await Api.post('/api/session-config', payload);
    ModelState.provider = provider;
    ModelState.model = model;
    if (reasoning) ModelState.reasoning = reasoning;
    else if (r && r.config && r.config.reasoningEffort) ModelState.reasoning = r.config.reasoningEffort;
    updateModelBtn();
    toast('已切换到 ' + model);
    await renderModelBody();
  } catch (e) {
    toast('切换失败：' + (e && e.message));
  }
}

/* ---------- 绑定 ---------- */
(function () {
  var plus = document.getElementById('btnPlus');
  var menu = document.getElementById('plusMenu');
  var fi = document.getElementById('imgFile');
  var bm = document.getElementById('btnModel');

  function hidePlus() { if (menu) menu.classList.add('hidden'); }
  function showPlus() { if (menu) menu.classList.remove('hidden'); }

  if (plus && menu) {
    plus.onclick = function (e) {
      e.stopPropagation();
      if (menu.classList.contains('hidden')) showPlus(); else hidePlus();
    };
    menu.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      hidePlus();
      var act = b.dataset.act;
      if (act === 'img' && fi) fi.click();
      else if (act === 'tools' && typeof openToolsSheet === 'function') openToolsSheet();
      else if (act === 'model') openModelSheet();
    });
    // 点空白处关闭
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== plus) hidePlus();
    });
  }
  if (fi) fi.onchange = function () {
    // 关键：先把 FileList 拷贝成数组再清空 input。
    // addImageFiles 是 async（读文件 + 拉 catalog），若立刻 fi.value='' 会把
    // FileList 清空，异步函数遍历时已为空 → 图片永远加不进去。
    var picked = fi.files ? Array.prototype.slice.call(fi.files) : [];
    fi.value = '';
    if (picked.length) addImageFiles(picked);
  };
  if (bm) bm.onclick = openModelSheet;
})();
</script>

<script>
/* ============================================================
 * 增量模块：Markdown 渲染 + 审批/问询弹窗 + 连接诊断
 * ============================================================ */

/* ---------- 1. 轻量 Markdown 渲染（无依赖） ---------- */
var Md = {
  esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  },
  inline(s) {
    var t = Md.esc(s);
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>"')]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return t;
  },
  render(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0, inCode = false, codeLang = '', codeBuf = [], listType = null;
    function flushList() { if (listType) { out.push('</' + listType + '>'); listType = null; } }
    while (i < lines.length) {
      var line = lines[i];
      var fence = /^```(\w*)\s*$/.exec(line);
      if (fence) {
        if (!inCode) { flushList(); inCode = true; codeLang = fence[1] || ''; codeBuf = []; }
        else {
          out.push('<pre class="md-code"><code>' + Md.esc(codeBuf.join('\n')) + '</code></pre>');
          inCode = false; codeLang = ''; codeBuf = [];
        }
        i++; continue;
      }
      if (inCode) { codeBuf.push(line); i++; continue; }
      if (/^\s*$/.test(line)) { flushList(); i++; continue; }
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flushList(); var lv = h[1].length; out.push('<h' + lv + '>' + Md.inline(h[2]) + '</h' + lv + '>'); i++; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { flushList(); out.push('<hr>'); i++; continue; }
      var q = /^>\s?(.*)$/.exec(line);
      if (q) { flushList(); out.push('<blockquote>' + Md.inline(q[1]) + '</blockquote>'); i++; continue; }
      // ---- 表格（GFM）----
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        flushList();
        const parseRow = function (ln) {
          return ln.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (x) { return x.trim(); });
        };
        const header = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(parseRow(lines[i])); i++; }
        let tHtml = '<div class="mdtablewrap"><table><thead><tr>';
        for (let ci = 0; ci < header.length; ci++) tHtml += '<th>' + Md.inline(header[ci]) + '</th>';
        tHtml += '</tr></thead><tbody>';
        for (let ri = 0; ri < rows.length; ri++) {
          tHtml += '<tr>';
          for (let ci = 0; ci < header.length; ci++) tHtml += '<td>' + Md.inline(rows[ri][ci] == null ? '' : rows[ri][ci]) + '</td>';
          tHtml += '</tr>';
        }
        tHtml += '</tbody></table></div>';
        out.push(tHtml);
        continue;
      }
      var ul = /^\s*[-*+]\s+(.*)$/.exec(line);
      if (ul) {
        if (listType !== 'ul') { flushList(); out.push('<ul>'); listType = 'ul'; }
        out.push('<li>' + Md.inline(ul[1]) + '</li>'); i++; continue;
      }
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ol) {
        if (listType !== 'ol') { flushList(); out.push('<ol>'); listType = 'ol'; }
        out.push('<li>' + Md.inline(ol[1]) + '</li>'); i++; continue;
      }
      flushList();
      var para = line;
      while (i + 1 < lines.length && !/^\s*$/.test(lines[i+1]) && !/^(#{1,6}\s|```|>|[-*+]\s|\d+[.)]\s)/.test(lines[i+1])) {
        i++; para += '\n' + lines[i];
      }
      out.push('<p>' + Md.inline(para).replace(/\n/g, '<br>') + '</p>');
      i++;
    }
    if (inCode && codeBuf.length) out.push('<pre class="md-code"><code>' + Md.esc(codeBuf.join('\n')) + '</code></pre>');
    flushList();
    let html = out.join('');
    // 还原表格占位符
    html = html.replace(/__TABLE_(\d+)__/g, function (m, idx) { return Md._tables[Number(idx)] || ''; });
    Md._tables = [];
    return html;
  }
};


/* ---------- 2. 审批 / 问询弹窗 ---------- */
var Pending = { frames: new Map() };

function showQuestionSheet(frame) {
  var f = frame;
  var rpcId = f.rpcId || f.questionRpcId || '';
  var sessionId = f.sessionId || State.activeSession || '';
  var questions = f.questions || [];
  if (!questions.length) return;
  ensureSheet();
  var box = $('#sheetBody'); box.innerHTML = '';
  box.appendChild(el('h3', null, '❓ Agent 需要你回答'));
  var answers = new Map();
  for (var qi = 0; qi < questions.length; qi++) {
    (function (q) {
      var wrap = el('div', 'field');
      if (q.header) { var hd = el('div', 'tag'); hd.textContent = q.header; hd.style.marginBottom = '6px'; wrap.appendChild(hd); }
      var qt = el('div'); qt.style.cssText = 'font-size:14px;margin-bottom:8px;white-space:pre-wrap'; qt.textContent = q.question || '';
      wrap.appendChild(qt);
      if (q.detail) {
        var d = el('div'); d.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;white-space:pre-wrap';
        d.textContent = q.detail; wrap.appendChild(d);
      }
      var opts = q.options || [];
      var multi = q.multiSelect === true;
      answers.set(q.id, { selected: [], custom: '' });
      if (opts.length) {
        var list = el('div'); list.style.cssText = 'display:flex;flex-direction:column;gap:6px';
        opts.forEach(function (o) {
          var label = (o && (o.label != null ? o.label : o.value)) || String(o);
          var b = el('button', 'btn');
          b.style.textAlign = 'left';
          b.dataset.label = label;
          b.textContent = (multi ? '☐ ' : '○ ') + label;
          b.onclick = function () {
            var a = answers.get(q.id);
            if (multi) {
              var idx = a.selected.indexOf(label);
              if (idx >= 0) { a.selected.splice(idx, 1); b.textContent = '☐ ' + label; b.style.borderColor = ''; }
              else { a.selected.push(label); b.textContent = '☑ ' + label; b.style.borderColor = 'var(--accent)'; }
            } else {
              a.selected = [label]; a.custom = '';
              Array.prototype.forEach.call(list.children, function (sib) {
                sib.style.borderColor = ''; sib.textContent = '○ ' + sib.dataset.label;
              });
              b.style.borderColor = 'var(--accent)'; b.textContent = '● ' + label;
            }
          };
          list.appendChild(b);
        });
        wrap.appendChild(list);
      }
      var cin = el('input');
      cin.placeholder = opts.length ? '或输入自定义答案（填了则忽略选项）' : '输入答案';
      cin.style.marginTop = '8px';
      cin.oninput = function () { answers.get(q.id).custom = cin.value.trim(); };
      wrap.appendChild(cin);
      box.appendChild(wrap);
    })(questions[qi]);
  }
  var row = el('div', 'btnrow');
  var bOk = el('button', 'btn primary', '提交回答');
  bOk.onclick = async function () {
    var payload = { kind: 'question', rpcId: rpcId, sessionId: sessionId, answers: [] };
    questions.forEach(function (q) {
      var a = answers.get(q.id);
      var item = { id: q.id, selected: a.custom ? [] : a.selected.slice() };
      if (a.custom) item.custom = a.custom;
      payload.answers.push(item);
    });
    try {
      var r = await Api.post('/api/respond', payload);
      if (r.accepted === false) toast('已被另一端先回答：' + (r.reason || ''));
      else toast('已提交');
      Pending.frames.delete(rpcId); closeSheet();
    } catch (e) { toast('提交失败：' + e.message); }
  };
  row.appendChild(bOk);
  var bCancel = el('button', 'btn', '取消');
  bCancel.onclick = async function () {
    try { await Api.post('/api/respond', { kind: 'cancel', rpcId: rpcId, sessionId: sessionId }); toast('已取消'); }
    catch (e) { toast('取消失败：' + e.message); }
    Pending.frames.delete(rpcId); closeSheet();
  };
  row.appendChild(bCancel);
  box.appendChild(row);
  showSheet();
}

function showApprovalSheet(frame) {
  var f = frame;
  var rpcId = f.rpcId || '';
  var sessionId = f.sessionId || State.activeSession || '';
  var approvalId = f.approvalId || '';
  ensureSheet();
  var box = $('#sheetBody'); box.innerHTML = '';
  box.appendChild(el('h3', null, '🔐 工具请求权限'));
  var wrap = el('div', 'field');
  var t = el('div'); t.style.cssText = 'font-size:14px;margin-bottom:6px';
  t.textContent = '工具：' + (f.toolName || '(未知)');
  wrap.appendChild(t);
  if (f.reason) {
    var r = el('div'); r.style.cssText = 'font-size:13px;color:var(--muted);white-space:pre-wrap';
    r.textContent = f.reason; wrap.appendChild(r);
  }
  box.appendChild(wrap);
  var row = el('div', 'btnrow');
  var bAllow = el('button', 'btn primary', '允许一次');
  bAllow.onclick = async function () {
    try {
      var r = await Api.post('/api/respond', { kind: 'approval', rpcId: rpcId, sessionId: sessionId, approvalId: approvalId, outcome: 'allowed-once' });
      toast(r.accepted === false ? '已被另一端先处理' : '已允许');
      Pending.frames.delete(approvalId || rpcId); closeSheet();
    } catch (e) { toast('失败：' + e.message); }
  };
  row.appendChild(bAllow);
  var bDeny = el('button', 'btn danger', '拒绝');
  bDeny.onclick = async function () {
    try {
      var r = await Api.post('/api/respond', { kind: 'approval', rpcId: rpcId, sessionId: sessionId, approvalId: approvalId, outcome: 'rejected' });
      toast(r.accepted === false ? '已被另一端先处理' : '已拒绝');
      Pending.frames.delete(approvalId || rpcId); closeSheet();
    } catch (e) { toast('失败：' + e.message); }
  };
  row.appendChild(bDeny);
  box.appendChild(row);
  showSheet();
}

/* ---------- 3. 连接失败诊断 ---------- */
function explainConnError(e) {
  var msg = (e && e.message) || String(e);
  if (/NetworkError|Failed to fetch|fetch failed/i.test(msg)) {
    return '无法连接到该地址。常见原因：① 跨源（网页与 API 不同源，插件无 CORS 头会被浏览器拦）→ 请填与当前网页同一个地址；② 地址不可达（手机需能访问：局域网 IP 或 frp 公网地址）；③ 服务未启动或端口错误。';
  }
  if (/401|auth-required|bad-token/i.test(msg)) return '口令不对：请核对插件配置里的 authToken。';
  if (/403|cross-site/i.test(msg)) return '跨站被拒：请用同源地址访问。';
  return msg;
}
